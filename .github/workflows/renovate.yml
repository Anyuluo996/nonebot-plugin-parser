name: Renovate

on:
  schedule:
    # 每周一 00:00 UTC（北京时间周一 08:00）触发一次工作流
    # Renovate 实际处理升级的时机由 renovate.json 的 schedule 控制
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # 支持手动触发，用于调试或立即扫描

permissions: {}

jobs:
  renovate:
    name: Self-hosted Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v42.0.0
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # 自托管模式需显式指定目标仓库，否则 "No repositories found" 空跑
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: debug
