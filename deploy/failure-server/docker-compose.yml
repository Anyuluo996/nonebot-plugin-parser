services:
  failure-server:
    build: .
    container_name: parser-failure-server
    restart: unless-stopped
    # host 网络 + 监听 127.0.0.1:8317，不对外暴露；由宿主 nginx/openresty 反代
    network_mode: host
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    command: ["uvicorn", "server:app", "--host", "127.0.0.1", "--port", "8317"]
