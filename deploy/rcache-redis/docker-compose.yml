# 结果缓存 Redis 单实例（仅内网监听）
#
# 使用：
#   1. cp redis.conf.example redis.conf && chmod 600 redis.conf
#   2. 编辑 redis.conf：bind 改为本机内网可达地址；<密码> 处填
#      `openssl rand -hex 32` 生成的值
#   3. docker compose up -d
#
# redis.conf 含明文密码，已被 .gitignore 排除，不要提交进任何仓库。
# 插件侧连接串形如：redis://pcache:<密码>@<本机内网地址>:6379/0

services:
  rcache-redis:
    image: redis:8.2-alpine
    container_name: rcache-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    network_mode: host
